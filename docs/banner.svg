<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Pompon: for the same 24,000 BTU/h, LogisVert pays 1,200 dollars for an ENERGY STAR heat pump and 2,880 dollars for a Cold Climate unit. Engine 12 of 12, page 1,005 of 1,005, linter 10 of 10, weekly rule watcher.">
  <title>Pompon · LogisVert subsidy before you sign</title>
  <defs>
    <style>
