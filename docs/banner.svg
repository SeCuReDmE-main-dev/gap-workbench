  </defs>

  <!-- WTF palette: ink band, purple field, lavender accents, square corners -->
  <rect width="1200" height="240" fill="#7c3aed"/>
  <rect width="1200" height="34" fill="#1f1d2b"/>
  <text x="28" y="23" class="b" style="font-size:13px;fill:#ede9fe;font-weight:700;letter-spacing:2px">FIND THE GAP · 45-MINUTE BUILD</text>
  <rect x="1012" y="8" width="160" height="18" fill="#ede9fe"/>
  <text x="1092" y="22" class="b tag" text-anchor="middle">GAP-WORKBENCH</text>

  <!-- Pompon (unchanged design, ink outline) -->
  <g transform="translate(24 46) scale(1.3)">
    <rect x="20" y="46" width="80" height="62" rx="20" fill="#ede9fe" stroke="#1f1d2b" stroke-width="3"/>
    <circle cx="60" cy="88" r="14" fill="#fff" stroke="#c4b5fd" stroke-width="3"/>
    <circle cx="46" cy="64" r="6" fill="#fff"/><circle cx="74" cy="64" r="6" fill="#fff"/>
    <circle cx="47" cy="65" r="3.6" fill="#1f1d2b"/><circle cx="73" cy="65" r="3.6" fill="#1f1d2b"/>
    <ellipse cx="38" cy="72" rx="4.5" ry="2.6" fill="#f9a8d4"/><ellipse cx="82" cy="72" rx="4.5" ry="2.6" fill="#f9a8d4"/>
    <path d="M54 71 Q60 76 66 71" fill="none" stroke="#1f1d2b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M26 48 Q30 14 60 12 Q90 14 94 48 Z" fill="#1f1d2b"/>
    <rect x="22" y="42" width="76" height="10" rx="5" fill="#ede9fe"/>
    <circle cx="60" cy="10" r="8" fill="#fcd34d"/>
  </g>

  <!-- Title -->
  <text x="200" y="84" class="d h">POMPON</text>
  <text x="200" y="110" class="b s">Know your LogisVert subsidy before you sign a heat pump quote</text>
  <text x="200" y="130" class="b s" style="fill:#c4b5fd">Connaissez votre subvention avant de signer</text>

  <!-- Bars: same 24,000 BTU/h -->
  <text x="200" y="164" class="b l">SAME 24,000 BTU/h AT −8 °C</text>
