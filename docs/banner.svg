      .b { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      .h { font-size: 40px; fill: #fff; letter-spacing: 1px; }
      .s { font-size: 16px; fill: #ede9fe; }
      .tag { font-size: 13px; fill: #1f1d2b; font-weight: 700; letter-spacing: 1.5px; }
      .l { font-size: 15px; fill: #ede9fe; font-weight: 600; }
      .v { font-size: 24px; fill: #1f1d2b; }
      .k { font-size: 30px; fill: #fff; }
      .t { font-size: 13px; fill: #ede9fe; }
