<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Pompon, a friendly heat pump in a winter tuque and scarf">
  <title>Pompon</title>
  <ellipse cx="60" cy="114" rx="32" ry="4" fill="#1f1d2b" opacity=".12"/>
  <!-- body: rounded outdoor unit -->
  <rect x="20" y="46" width="80" height="62" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/>
  <!-- fan grille as a belly -->
  <circle cx="60" cy="88" r="14" fill="#fff" stroke="#c4b5fd" stroke-width="3"/>
  <path d="M60 78 Q66 86 60 88 Q54 90 60 98 M50 88 Q58 82 60 88 Q62 94 70 88" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
  <!-- face -->
  <circle cx="46" cy="64" r="6" fill="#fff"/><circle cx="74" cy="64" r="6" fill="#fff"/>
  <circle cx="47" cy="65" r="3.6" fill="#1f1d2b"/><circle cx="73" cy="65" r="3.6" fill="#1f1d2b"/>
  <circle cx="48.3" cy="63.6" r="1.2" fill="#fff"/><circle cx="74.3" cy="63.6" r="1.2" fill="#fff"/>
  <ellipse cx="38" cy="72" rx="4.5" ry="2.6" fill="#f9a8d4"/><ellipse cx="82" cy="72" rx="4.5" ry="2.6" fill="#f9a8d4"/>
  <path d="M54 71 Q60 76 66 71" fill="none" stroke="#1f1d2b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- tuque with pompon -->
  <path d="M26 48 Q30 14 60 12 Q90 14 94 48 Z" fill="#7c3aed"/>
  <path d="M38 30 L82 30 M34 38 L86 38" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  <rect x="22" y="42" width="76" height="10" rx="5" fill="#fbbf24"/>
  <circle cx="60" cy="10" r="8" fill="#fcd34d"/>
  <!-- scarf -->
  <path d="M28 54 Q60 62 92 54" fill="none" stroke="#f59e0b" stroke-width="0" />
  <!-- little warm-air waves -->
  <path d="M104 70 q4 -4 0 -8 M110 74 q5 -6 0 -12" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- feet -->
  <rect x="34" y="106" width="14" height="6" rx="3" fill="#57606a"/><rect x="72" y="106" width="14" height="6" rx="3" fill="#57606a"/>
</svg>
